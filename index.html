<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家庭记账">
  <meta name="description" content="一家人的账记在一起：语音或文字记账，自动分类，共享账本与图表统计。">
  <title>家庭记账本</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <div class="loading">正在打开…</div>
  </div>
  <noscript>
    <p style="padding:24px;font-family:system-ui">这个记账本需要开启 JavaScript 才能使用。</p>
  </noscript>
  <script type="module">
    import { mount } from './src/app.js';

    mount(document.getElementById('app')).catch((err) => {
      console.error(err);
      document.getElementById('app').innerHTML = `
        <div style="padding:24px;font-family:system-ui;line-height:1.7">
          <h2>没能启动</h2>
          <p>${err && err.message ? String(err.message).replace(/</g, '&lt;') : '未知错误'}</p>
          <p style="color:#6b7280">如果是直接双击打开的本地文件，浏览器会拦截模块加载。
          请用本地服务器打开，或直接使用线上地址。</p>
        </div>`;
    });
  </script>
</body>
</html>
